<style>
:root{--bg:#f1f4f8;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d3dbe5;--pr:#00447c;--prt:#fff;--ac:#e6edf6;--dg:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--tx:#e6ebf1;--mu:#9aa8b8;--bd:#2d3846;--pr:#6aa6e6;--prt:#0b1520;--ac:#223042;--dg:#ff8a80}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--tx:#e6ebf1;--mu:#9aa8b8;--bd:#2d3846;--pr:#6aa6e6;--prt:#0b1520;--ac:#223042;--dg:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#00447c;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}header h1{font-size:17px;margin:0}header small{opacity:.85}
main{max-width:720px;margin:0 auto;padding:12px 12px 100px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 4px;color:var(--pr)}summary{font-weight:600;color:var(--pr);cursor:pointer}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-block;font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--pr);background:transparent;color:var(--pr);cursor:pointer;margin:8px 8px 0 0;text-align:center}
.pri{background:var(--pr);color:var(--prt)}
.hd{display:flex;gap:8px;align-items:center}.hd b{color:var(--pr)}.hd input{margin:0;font-weight:600}
.x{border:0;background:var(--ac);color:var(--dg);border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.th{position:relative}.th img{width:100%;border-radius:8px;display:block}.th .x{position:absolute;top:4px;right:4px}
.lg{max-height:48px;margin:8px 8px 0 0;vertical-align:middle;background:#fff;border-radius:4px}
.an{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;margin-top:8px;align-items:center}.an input{margin:0}
canvas.sg{width:100%;height:150px;background:#fff;border:1px dashed var(--mu);border-radius:10px;touch-action:none;display:block;margin-top:6px}
.sgb{margin-top:12px;padding-top:8px;border-top:1px solid var(--bd)}[hidden]{display:none!important}#gate .c{max-width:340px;margin:12vh auto 0}#er{color:var(--dg);font-size:13px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .btn{flex:1;margin:0}
#pv{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:9;padding-top:env(safe-area-inset-top,0px)}
#pv[hidden]{display:none}#pv .bar{position:static;border:0;border-bottom:1px solid var(--bd)}#fr{flex:1;border:0;width:100%;background:#fff}
#toast{position:fixed;left:12px;right:12px;bottom:84px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:10;display:none}#toast a{color:inherit;font-weight:700}
#st{font-size:12px;color:var(--mu);text-align:center;margin:4px 0 12px}
#fr{overflow:auto;background:#6b7280;padding:8px}#fr canvas{width:100%;max-width:820px;display:block;margin:0 auto 8px;background:#fff}#fr{color:#fff}
select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;margin-top:3px}
::placeholder{color:var(--mu);opacity:.75}.ht{font-size:12px;color:var(--mu);margin:6px 0 0}
.sm{background:none;border:0;color:var(--pr);text-decoration:underline;font:inherit;font-size:13px;padding:10px 0 0;cursor:pointer}
body:not(.m) .mob{display:none}.rec{border-color:var(--pr)}

  const w=await h.createWritable();await w.write(b);await w.close();if(reuse)fh=h;return 'Gespeichert: '+h.name}catch(e){if(e.name==='AbortError')return null}}
 if(!dlOnly&&MOB){let f=new File([b],name,{type:b.type});const cs=x=>navigator.canShare&&navigator.canShare({files:[x]});
  if(!cs(f)&&ext==='json')f=new File([b],name.replace(/\.json$/,'.txt'),{type:'text/plain'});
  if(cs(f)){try{await navigator.share({files:[f],title:name});return 'Über das Teilen-Menü übergeben – dort Ablageort wählen.'}catch(e){if(e.name==='AbortError')return null}}}
 const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return 'Als Download gespeichert: '+name}
async function savef(dl){const b=new Blob([JSON.stringify({app:'fact-bue',version:2,...S})],{type:'application/json'}),r=await saveFile(b,base()+'.json',true,dl);if(r){msg(r);try{localStorage.removeItem('bue-auto')}catch(x){}}}
async function savepdf(){let b;try{b=mk()}catch(e){return msg('PDF konnte nicht erstellt werden: '+e.message)}const r=await saveFile(b,base()+'.pdf',false);if(r)msg(r)}
async function loadFile(f){try{S=norm(JSON.parse(await f.text()));REC=null;render();msg('Protokoll geladen: '+f.name)}catch(e){msg('Datei konnte nicht gelesen werden.')}}
async function loadf(){if(window.showOpenFilePicker){try{const[h]=await showOpenFilePicker({types:[{description:'Protokolldatei',accept:{'application/json':['.json'],'text/plain':['.txt']}}]});await loadFile(await h.getFile());fh=h.name.endsWith('.json')?h:null;return}catch(e){if(e.name==='AbortError')return}}$('#ldf').click()}
async function prev(){try{const b=mk(),box=$('#fr');$('#pv').hidden=false;if(!window.pdfjsLib){box.textContent='Vorschau braucht einmal Internet zum Laden.';return}
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';box.textContent='Vorschau wird erstellt …';
 const p=await pdfjsLib.getDocument({data:new Uint8Array(await b.arrayBuffer()),isEvalSupported:false}).promise;box.textContent='';
 for(let i=1;i<=p.numPages;i++){const pg=await p.getPage(i),vp=pg.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;box.append(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}}catch(e){msg('Vorschau nicht möglich: '+(e.message||e))}}
async function send(){let b;try{b=mk()}catch(e){return msg('PDF konnte nicht erstellt werden: '+e.message)}
 const f=new File([b],base()+'.pdf',{type:'application/pdf'}),er=S.ers,sub='Protokoll Baustellenbegehung '+fd(S.datum)+(S.bm?' – '+S.bm:''),
 body='Guten Tag,\n\nanbei das Protokoll der Baustellenbegehung vom '+fd(S.datum)+'.\n\nMit freundlichen Grüßen\n'+[er.n,'FACT GmbH'+(er.f?' · '+er.f:''),er.t&&'Tel. '+er.t,er.m&&'Mobil '+er.m,er.e].filter(Boolean).join('\n');
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:sub,text:body});return}}catch(x){if(x.name==='AbortError')return}
 const r=await saveFile(b,f.name,false,true);msg((r||'')+' – bitte in der Mail-App anhängen.','mailto:?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body))}
const cy=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
async function ok(p){p=p.trim().normalize('NFC').toLowerCase();try{if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')===PW}}catch(e){}return cy(p)===PW2}

if(u)unlock();else{const go=async()=>{if(await ok($('#pw').value)){try{sessionStorage.setItem('bue-ok','1')}catch(e){}unlock()}else $('#er').textContent='Passwort falsch.'};$('#go').onclick=go;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
